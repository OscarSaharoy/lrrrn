<!doctype html>
<html>
<head> <!-- head -------------------------------------------------- -->




<title> 💬 lrrrn </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root {
    font-size: min(1em, 2.6vw);
}

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: serif;
    font-size: 1.6rem;
}

body {
    background: black;
    color: white;
}

button {
    appearance: none;
    border: 1px solid white;
    border-radius: 0.4rem;
    padding: 1rem;
    background: none;
    cursor: pointer;
    color: white;
}
button:hover {
    text-shadow: 0 0 1.5rem white;
}
button.selected {
    background: #8ff3;
}

.key, input {
    color: white;
    font-family: monospace;
    padding: 0.4rem 0.7rem;
    border: 1px solid #fff4;
    border-radius: 0.8rem;
    background: none;
}
.key {
    font-size: 1rem;
}
div.stack {
    display: grid;
    place-items: center;
    gap: 0.5rem;
}

.prompt p, .phrase p {
    font-size: 2rem;
}

</style>




</head>
<body> <!-- body -------------------------------------------------- -->




<div style="width: 100vw; height: 100vh; display: grid; place-items: center;">

    <audio autoplay controls class="recording" style="display: none;">
      <source src="" type="audio/mpeg">
    </audio>
    
    <article style="display: grid; gap: 1rem; height: 100%; width: 100vw; max-width: 44rem; padding: 3rem; grid-template-rows: min-content min-content 1fr 20%">
        <div class="lang-toggle" style="display: grid; grid-auto-flow: column; gap: 1rem; margin-top: 2rem; align-items: center; justify-content: center; margin-bottom: -2rem; grid-template-columns: max-content 1fr max-content">
            <p style="width: 5.9rem;"> lrrrn </p>
            <p id="score" style="font-family: monospace; text-align: center;"> 0 </p>
            <div style="display: grid; grid-template-columns: max-content max-content; gap: 0.75rem;">
                <button id="bg" style="text-decoration: underline; border: none; padding: 1rem 0.5rem">🇧🇬  </button>
                <button id="ar" style="border: none; padding: 1rem 0.5rem;">🇸🇩   </button>
            </div>
        </div>
        <div style="display: grid; grid-auto-flow: row; gap: 1rem; margin-top: 2rem; grid-template-columns: 1fr 1fr;">
            <button class="selected" id="listen">🎧 listen</button>
            <button id="speak">💬 speak</button>
            <button id="revise" style="position: relative;">
                🤔 revise
                <span style="position: absolute; right: 0.65rem; top: 0.5rem; font-family: monospace; font-size: 1.2rem; opacity: 0.85;"></span>
            </button>
            <button id="dictionary">📖 dictionary</button>
        </div>

        <div class="prompt" style="display: grid; gap: 0.7rem; align-content: center; place-items: center; text-align: center;">
            <p> click "next" to start! </p>
        </div>

        <div class="phrase" style="display: grid; gap: 0.7rem; align-content: center; display: none; place-items: center; text-align: center;">
            <p class="foreign"> foreign </p>
            <p class="transliteration"> transliteration </p>
            <p class="english"> english </p>
        </div>

        <div class="search" style="display: none; gap: 2rem; align-content: start; text-align: center; grid-template-rows: max-content 1fr;">
            <input id="search-box" style="padding: 1rem; background: #fff1; font-family: serif; border-radius: 1.5rem; margin-top: 1rem;" placeholder="Search" />
            
            <button id="result-template" class="result" style="display: none; gap: 0.7rem; align-content: center; place-items: center; text-align: center; grid-auto-flow: row; padding: 0; border: none;">
                <p class="foreign"> foreign </p>
                <p class="transliteration"> transliteration </p>
                <p class="english"> english </p>
            </button>

            <div id="search-results" style="display: grid; align-content: start; gap: 3rem; height: 110%; overflow: scroll;">
            </div>
        </div>

        <div class="buttons" style="display: grid; gap: 1rem; align-items: center; grid-template-columns: 1fr 1fr 1fr; align-items: stretch">
            <button id="replay">
                <div class="stack">
                    <p>🔁 replay</p>
                    <span class="key">R</span>
                </div>
            </button>
            <button id="save">
                <div class="stack">
                    <p>🤔 revise</p>
                    <span class="key">S</span>
                </div>
            </button>
            <button id="continue">
                <div class="stack">
                    <p>👍 next</p>
                    <span class="key">Space</span>
                </div>
            </button>
        </div>
    </article>


</div>



<!--<script src="data.json.js"></script>-->
<script src="data.bg.json.js"></script>
<script src="data.phrases.bg.json.js"></script>
<script src="data.json.js"></script>
<script src="words.json.js"></script>
<script>

const wordsDataAr = dataAr.filter(d => words.includes(d.english?.toLowerCase()) || d.category === "conversation-starters");
const dataBg = [...phrasesDataBg, ...wordsDataBg]
let wordsData = dataBg;
let mode = "listen";
let score = 0;
let reviseWords = [];
let reviseIndex = 0;
let currentPhrase = null;

function setMode(newMode) {
    mode = newMode;

    for(const id of ["listen", "speak", "revise", "dictionary"]) {
        if( mode === id ) document.getElementById(id).classList.add("selected");
        else document.getElementById(id).classList.remove("selected");
    }

    if(newMode === "dictionary") show(".search") + showResults("");
    else setCard(getRandomPhrase());
}

function setRecording(phrase) {
    const recording = document.querySelector(".recording");
    const recordingClone = recording.cloneNode(true);
    recordingClone.volume = 1;
    recording.parentElement.prepend(recordingClone);
    recording.remove();

    const source = recordingClone.querySelector("source");
    const sourceClone = source.cloneNode();
    source.remove();
    sourceClone.setAttribute("src", phrase.recording);
    recordingClone.appendChild(sourceClone);
}

function pause() {
    document.querySelector(".recording").pause();
}

function replay() {
    pause();
    document.querySelector(".recording").currentTime = 0;
    document.querySelector(".recording").play();
}

function save() {
    const currentWord = document.querySelector(".phrase .foreign").innerText;
    if( !reviseWords.map(([w, _]) => w).includes(currentWord) )
        reviseWords.push([currentWord, mode]);
    document.querySelector("#revise span").innerText = reviseWords.length;
    next(false);
}

function say( s, lang="en" ) {
    const synth = window.speechSynthesis;
    const utterThis = new SpeechSynthesisUtterance(s);
    utterThis.voice = {
        "en": synth.getVoices()[0],
        "bg": synth.getVoices().filter(v => v.lang.includes("bg"))[0],
        "ar": synth.getVoices().filter(v => v.lang.includes("ar"))[0],
    }[lang];
    synth.speak(utterThis);
}

function show(className) {
    document.querySelector(".prompt").style.display = className === ".prompt" ? "grid" : "none";
    document.querySelector(".phrase").style.display = className === ".phrase" ? "grid" : "none";
    document.querySelector(".search").style.display = className === ".search" ? "grid" : "none";
    document.querySelector(".buttons").style.display = className !== ".search" ? "grid" : "none";

    if( className === ".phrase" ) {
        (currentPhrase.mode || mode) === "speak" ? replay() : pause() + say(document.querySelector(".english").textContent);
        score += 1;
        document.querySelector("#score").innerText = score;
        document.querySelector("#continue p").innerText = "👍 next";
    }
}

function setCard(phrase) {
    const cardMode = phrase.mode || mode;
    document.querySelector(".prompt p").innerText = cardMode === "speak" ? phrase.english || phrase.description : phrase.arabic || phrase.bulgarian;
    document.querySelector(".phrase .english").innerText = phrase.english || phrase.description;
    document.querySelector(".phrase .foreign").innerText = phrase.arabic || phrase.bulgarian;
    if( phrase.transliteration ) {
        document.querySelector(".phrase .transliteration").style.display = "unset";
        document.querySelector(".phrase .transliteration").innerText = phrase.transliteration;
    } else {
        document.querySelector(".phrase .transliteration").style.display = "none";
    }

    setRecording(phrase);
    show(".prompt");
    if( cardMode === "speak" ) pause() + say(phrase.english || phrase.description);
    document.querySelector("#continue p").innerText = "🔍 reveal";
    currentPhrase = phrase;
}

function getRandomPhrase() {
    let phrasesWithRecording = wordsData.filter(p => !!p.recording);
    if( mode === "revise" ) phrasesWithRecording = reviseWords.map(
        ([word, mode]) => ({...phrasesWithRecording.find(p => p.arabic == word || p.bulgarian == word), mode})
    );
    if( phrasesWithRecording.length === 0 ) return { bulgarian: "no saved words to revise", english: "no saved words to revise" };
    const index = mode === "revise" ? reviseIndex++ : Math.floor(Math.random() * phrasesWithRecording.length);
    return phrasesWithRecording[index % phrasesWithRecording.length]
}

function showResults() {
    const searchTerm = document.querySelector("input").value;
    const resultPhrases = wordsData
        .filter( d => (d.english || d.description).toLowerCase().includes(searchTerm.toLowerCase()) || (d.arabic || d.bulgarian).includes(searchTerm) || d.transliteration?.includes(searchTerm) )
        .sort( (d1, d2) => (d1.english || d1.description).localeCompare(d2.english || d2.description) );

    const template = document.querySelector("#result-template");
    const searchResults = document.querySelector("#search-results");
    searchResults.innerHTML = "";

    for( const resultPhrase of resultPhrases ) {
        const result = template.cloneNode(true);
        result.querySelector(".english").innerText = resultPhrase.english || resultPhrase.description;
        result.querySelector(".transliteration").style.display = resultPhrase.transliteration ? "unset" : "none";
        result.querySelector(".transliteration").innerText = resultPhrase.transliteration;
        result.querySelector(".foreign").innerText = resultPhrase.arabic || resultPhrase.bulgarian;
        result.style.display = "grid";
        result.onclick = () => setRecording(resultPhrase) + replay();
        searchResults.appendChild(result);
    }
}

function next(unsave) {
    const prompt = document.querySelector(".prompt");
    if( prompt.style.display === "grid" && prompt.textContent.trim() !== "click \"next\" to start!" ) {
        show(".phrase");
    } else {
        if(unsave) {
            reviseWords = reviseWords.filter(([rw, _]) => rw !== document.querySelector(".foreign").innerText);
            document.querySelector("#revise span").innerText = reviseWords.length;
        }
        setCard(getRandomPhrase());
    }
}

document.querySelector("#listen").onclick = () => setMode("listen");
document.querySelector("#speak").onclick = () => setMode("speak");
document.querySelector("#revise").onclick = () => setMode("revise");
document.querySelector("#dictionary").onclick = () => setMode("dictionary");
document.querySelector("#continue").onclick = () => next(mode === "revise");
document.querySelector("#replay").onclick = replay;
document.querySelector("#save").onclick = save;
document.onkeydown = e =>
    mode !== "dictionary" ? (
        e.key === " " ? next(mode === "revise") + e.preventDefault() :
        e.key === "s" ? save() :
        e.key === "r" ? replay() : null
    ) : null;

document.querySelector("#search-box").oninput = showResults;
document.querySelector("#ar").onclick = () => {
    wordsData = wordsDataAr;
    document.querySelector("#ar").style.textDecoration = "underline";
    document.querySelector("#bg").style.textDecoration = "unset";
}
document.querySelector("#bg").onclick = () => {
    wordsData = dataBg;
    document.querySelector("#bg").style.textDecoration = "underline";
    document.querySelector("#ar").style.textDecoration = "unset";
}


if(window.location.search.includes("ar")) {
    document.querySelector("#ar").click();
}

</script>




</body> 
</html>
